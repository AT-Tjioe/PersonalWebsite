<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - AP Guns</title>
    <!-- Pointing to your single shared stylesheet -->
    <link rel="stylesheet" href="PW.css">
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <div class="container header-flex">
            <a href="index.html" class="logo">AP Guns</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="about.html">About</a></li>
                    <li><a href="inventory.html">Inventory</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Dedicated Contact Section -->
    <main class="contact-section">
        <div class="container small-container">
            <h2 class="section-title text-center">Get In Touch</h2>
            <p class="section-desc text-center">Have questions about an upcoming purchase, stock availability, or a custom order? Reach out directly below.</p>
            
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" rows="5" placeholder="How can I help you?" required></textarea>
                </div>
                <button type="submit" class="btn btn-full">Send Message</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; All rights reserved. AP Guns.</p>
        </div>
    </footer>

</body>
</html>
